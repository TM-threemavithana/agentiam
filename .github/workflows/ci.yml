name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Verify module
        run: go mod tidy && git diff --exit-code go.sum

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run

      - name: Build
        run: make build

      - name: Unit Tests
        run: make test

      - name: Race Detection
        run: go test -race -short ./...

      - name: Integration Tests
        run: make test-integration
        timeout-minutes: 10

      - name: Benchmark
        run: make bench
