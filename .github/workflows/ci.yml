name: CI

'on':
  push:
    branches: [main, 'fix/**', 'chore/**', 'security/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-unit-tests:
    name: Code Quality, Build & Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@3041ec5666fa9f4fa7b6b0c6395b0606f7fb7e6d # v5.3.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify Go source formatting (gofmt)
        run: |
          echo "==> Verifying gofmt compliance..."
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following Go files are not formatted according to gofmt standards:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "All Go files are gofmt-compliant."

      - name: Verify Go module dependency integrity
        run: |
          echo "==> Running go mod verify..."
          go mod verify

      - name: Guard against retired pgproto3/v2 reintroduction
        run: |
          echo "==> Verifying absence of vulnerable legacy pgproto3 dependency (GO-2026-4518)..."
          if grep -E "github\.com/jackc/pgproto3" go.mod go.sum 2>/dev/null; then
            echo "::error::Legacy dependency github.com/jackc/pgproto3 detected in module dependency graph!"
            exit 1
          fi
          echo "Confirmed: pgproto3/v2 is completely absent from go.mod and go.sum."

      - name: Static analysis (go vet)
        run: |
          echo "==> Running go vet..."
          go vet ./...

      - name: Run golangci-lint
        run: |
          echo "==> Installing pinned golangci-lint v1.64.6..."
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.6
          echo "==> Running golangci-lint..."
          golangci-lint run ./...

      - name: Build all AgentIAM commands
        run: |
          echo "==> Building AgentIAM CLI, control plane, and proxy commands..."
          go build -v ./cmd/...

      - name: Run unit and regression tests
        run: |
          echo "==> Running unit test suite..."
          go test -count=1 -v ./...

      - name: Run concurrency and race detection tests
        run: |
          echo "==> Running race detector on all packages..."
          go test -race -count=1 ./...

      - name: Vulnerability analysis (govulncheck)
        run: |
          echo "==> Installing pinned govulncheck tool..."
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "==> Running govulncheck security scan..."
          govulncheck ./...

  postgres-integration-tests:
    name: PostgreSQL 15 Integration & Security Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@3041ec5666fa9f4fa7b6b0c6395b0606f7fb7e6d # v5.3.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run PostgreSQL 15 integration test suite
        run: |
          echo "==> Running PostgreSQL wire-protocol, proxy, view-masking, and tenant integration tests..."
          go test -v -tags=integration -timeout 20m -run "TestViewMaskingIntegration|TestProxyIntegration|TestTLSUpgradeAndEnforcement" ./internal/proxy
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
